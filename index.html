<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPVFD — 2026 Call Records</title>
<style>
  :root {
    --red:    #C0272D;
    --red-dk: #8B1A1E;
    --red-lt: #F5E6E7;
    --gray:   #2C2C2C;
    --mid:    #555;
    --line:   #E0E0E0;
    --bg:     #F7F7F7;
    --white:  #FFFFFF;
    --badge-bg: #FFF3CD;
    --badge-border: #FBBF24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--gray);
    min-height: 100vh;
  }

  header { background: var(--red); color: #fff; padding: 0; }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 8px 20px 8px;
    display: flex; align-items: center; gap: 16px;
  }
  .badge-shield { width: 48px; height: 48px; flex-shrink: 0; }
  .header-text h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: .02em; line-height: 1.2; }
  .header-text p  { font-size: .82rem; opacity: .85; margin-top: 2px; }
  .header-stats { margin-left: auto; display: flex; gap: 24px; text-align: center; }
  .stat-pill { line-height: 1.1; }
  .stat-pill .num { font-size: 1.5rem; font-weight: 700; }
  .stat-pill .lbl { font-size: .72rem; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }

  .controls {
    background: var(--white);
    border-bottom: 2px solid var(--red);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .controls-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-group label {
    font-size: .75rem; font-weight: 600; color: var(--mid);
    text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
  }
  select, input[type=text], input[type=date] {
    border: 1.5px solid var(--line); border-radius: 6px;
    padding: 7px 10px; font-size: .85rem; color: var(--gray);
    background: var(--white); outline: none; transition: border-color .15s;
    font-family: inherit;
  }
  select:focus, input:focus { border-color: var(--red); }
  select { cursor: pointer; }
  .date-sep { font-size: .8rem; color: var(--mid); }

  .btn-reset {
    margin-left: auto; padding: 7px 16px;
    background: var(--red); color: #fff; border: none;
    border-radius: 6px; font-size: .82rem; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-reset:hover { background: var(--red-dk); }

  .result-count { font-size: .8rem; color: var(--mid); white-space: nowrap; }

  .highlight-bar { display: none; max-width: 1200px; margin: 12px auto 0; padding: 0 20px; }
  .highlight-bar.visible { display: block; }
  .highlight-inner {
    background: var(--badge-bg); border: 1.5px solid var(--badge-border);
    border-radius: 8px; padding: 10px 16px; font-size: .85rem;
    display: flex; align-items: center; gap: 10px;
  }
  .highlight-inner strong { color: var(--red-dk); }

  main { max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px; }

  .table-wrap {
    background: var(--white); border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,.07); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  thead { background: var(--gray); color: #fff; }
  th {
    padding: 11px 14px; text-align: left; font-weight: 600;
    font-size: .78rem; text-transform: uppercase; letter-spacing: .05em;
    white-space: nowrap; user-select: none;
  }

  tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background .1s; cursor: pointer;
  }
  tbody tr:hover { background: #FFF8F8; }
  tbody tr.my-call { background: #FFFBEA; }
  tbody tr.my-call:hover { background: #FFF5CC; }
  tbody tr.expanded { background: #FFF8F8; }

  td { padding: 10px 14px; vertical-align: top; }

  .inc-num { font-weight: 700; color: var(--red); font-size: .9rem; white-space: nowrap; }
  .type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: .75rem; font-weight: 600; white-space: nowrap;
  }
  .type-badge.fire    { background: #FFE8E8; color: #7F1D1D; }
  .type-badge.mva     { background: #E8F0FF; color: #1E3A8A; }
  .type-badge.alarm   { background: #F0F0F0; color: #374151; }
  .type-badge.hazmat  { background: #FFF3E0; color: #7C3C00; }
  .type-badge.gas     { background: #FFFDE7; color: #6B5000; }
  .type-badge.grass   { background: #E8F5E9; color: #1B5E20; }
  .type-badge.elec    { background: #EDE7F6; color: #311B92; }
  .type-badge.other   { background: #F5F5F5; color: #424242; }

  .loc-cell  { color: var(--mid); font-size: .8rem; max-width: 200px; }
  .date-cell { white-space: nowrap; color: var(--mid); }
  .units-cell, .pers-cell { text-align: center; font-weight: 600; }

  .name-badge {
    display: inline-block; background: var(--red); color: #fff;
    font-size: .68rem; font-weight: 700; padding: 2px 7px;
    border-radius: 10px; margin-left: 6px; vertical-align: middle;
    white-space: nowrap;
  }

  .detail-row td { padding: 0; background: #FAFAFA; border-bottom: 2px solid var(--red); }
  .detail-inner {
    padding: 14px 20px 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .detail-section h4 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--red-dk); font-weight: 700; margin-bottom: 8px;
  }
  .personnel-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .person-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--white); border: 1px solid var(--line);
    border-radius: 20px; padding: 3px 10px; font-size: .78rem;
  }
  .person-chip.me { background: #FFF9C4; border-color: var(--badge-border); font-weight: 700; }
  .person-chip.apparatus-match { background: #E8F0FF; border-color: #93B4F0; font-weight: 700; }
  .chip-apparatus { font-size: .68rem; color: var(--mid); background: var(--line); padding: 1px 5px; border-radius: 10px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--mid); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .empty-state p { font-size: .9rem; }

  @media (max-width: 700px) {
    .header-stats { display: none; }
    .detail-inner { grid-template-columns: 1fr; }
    .loc-cell, .date-cell { display: none; }
  }

  /* ── PIN LOCK ── */
  .pin-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--red);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }
  .pin-screen.hidden { display: none; }
  .pin-card {
    background: var(--white); border-radius: 16px;
    padding: 40px 36px 32px; width: 320px; text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);
  }
  .pin-logo {
    width: 90px; height: 90px; border-radius: 50%;
    background: var(--red); overflow: hidden;
    margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
  }
  .pin-logo img { width: 100%; height: 100%; object-fit: cover; }
  .pin-card h2 {
    font-size: 1.1rem; font-weight: 700; color: var(--gray);
    margin-bottom: 4px;
  }
  .pin-card p { font-size: .8rem; color: var(--mid); margin-bottom: 24px; }
  .pin-dots {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 24px;
  }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--line); background: transparent;
    transition: background .15s, border-color .15s;
  }
  .pin-dot.filled { background: var(--red); border-color: var(--red); }
  .pin-dot.error  { background: #FF4444; border-color: #FF4444; }
  .pin-keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .pin-key {
    padding: 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-size: 1.1rem; font-weight: 600; background: var(--white);
    color: var(--gray); cursor: pointer; transition: background .1s, border-color .1s;
    user-select: none;
  }
  .pin-key:hover  { background: var(--red-lt); border-color: var(--red); }
  .pin-key:active { background: var(--red); color: #fff; }
  .pin-key.clear  { font-size: .8rem; color: var(--mid); }
  .pin-error {
    margin-top: 14px; font-size: .8rem; color: #CC0000;
    min-height: 18px; font-weight: 600;
  }
</style>
</head>

const DATA = RAW.filter(r => r["Dispatch Time"]);

DATA.forEach(d => {
  const dt = d["Dispatch Time"];
  const parts = dt.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)/);
  if (parts) {
    d._date = new Date(+parts[3], +parts[1]-1, +parts[2], +parts[4], +parts[5]);
    d._isoDate = parts[3]+'-'+parts[1].padStart(2,'0')+'-'+parts[2].padStart(2,'0');
    d._dispStr = parts[1]+'/'+parts[2]+'/'+parts[3];
    const h = parseInt(parts[4]), m = parts[5];
    d._timeStr = (h===0?12:h>12?h-12:h)+':'+m+' '+(h>=12?'PM':'AM');
  }
  d._incNum = parseInt((d["Incident Number"]||'').split('-')[1]) || 0;
  d._pers   = parseInt(d["Personnel Count"]) || 0;
  d._personnel_names = d.personnel_list.map(p => p.name);
  // Apparatus that responded (excluding Personal Vehicle and Station 38, deduped)
  d._apparatus = [...new Set(
    d.personnel_list
      .map(p => p.apparatus.trim())
      .filter(a => a && a.toLowerCase() !== 'personal vehicle' && APPARATUS_LIST.includes(a))
  )];
  d._units = d._apparatus.length;
});

// Compute date bounds from data
const allDates = DATA.map(d => d._isoDate).filter(Boolean).sort();
const DATA_MIN = allDates[0];
const DATA_MAX = allDates[allDates.length-1];
// YTD default: Jan 1 of the data year through data max
const dataYear = DATA_MIN ? DATA_MIN.slice(0,4) : new Date().getFullYear();
const YTD_FROM = dataYear + '-01-01';
const YTD_TO   = DATA_MAX;

// Populate Name / Apparatus dropdown
const apparatusGroup  = document.getElementById('apparatusGroup');
const personnelGroup  = document.getElementById('personnelGroup');
APPARATUS_LIST.forEach(a => {
  const o = document.createElement('option'); o.value = 'apparatus:'+a; o.textContent = a;
  apparatusGroup.appendChild(o);
});
const allPersonnel = [...new Set(DATA.flatMap(d => d._personnel_names))].sort();
allPersonnel.forEach(n => {
  const o = document.createElement('option'); o.value = 'person:'+n; o.textContent = n;
  personnelGroup.appendChild(o);
});

// Populate type dropdown
const allTypes = [...new Set(DATA.map(d => d["Incident Type"]))].sort();
const typeSelect = document.getElementById('typeFilter');
allTypes.forEach(t => {
  const o = document.createElement('option'); o.value = t; o.textContent = t;
  typeSelect.appendChild(o);
});

// Set default date range
const dateFrom = document.getElementById('dateFrom');
const dateTo   = document.getElementById('dateTo');
dateFrom.value = YTD_FROM;
dateTo.value   = YTD_TO;
dateFrom.min = DATA_MIN; dateFrom.max = DATA_MAX;
dateTo.min   = DATA_MIN; dateTo.max   = DATA_MAX;

// State
let selectedFilter = '';   // 'person:Name' or 'apparatus:Eng 38-2' or ''
let typeFilter     = '';
let searchTerm     = '';
let expandedInc    = null;

document.getElementById('nameSelect').addEventListener('change', e => { selectedFilter = e.target.value; render(); });
typeSelect.addEventListener('change', e => { typeFilter = e.target.value; render(); });
dateFrom.addEventListener('change', render);
dateTo.addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', e => { searchTerm = e.target.value.toLowerCase(); render(); });

function resetAll() {
  selectedFilter = ''; typeFilter = ''; searchTerm = ''; expandedInc = null;
  document.getElementById('nameSelect').value = '';
  typeSelect.value = '';
  document.getElementById('searchBox').value = '';
  dateFrom.value = YTD_FROM;
  dateTo.value   = YTD_TO;
  render();
}

function typeBadgeClass(t) {
  if (/fire alarm|co alarm/i.test(t))            return 'alarm';
  if (/room and contents|vehicle fire|outside fire/i.test(t)) return 'fire';
  if (/motor vehicle|extrication/i.test(t))      return 'mva';
  if (/hazardous|haz/i.test(t))                  return 'hazmat';
  if (/gas leak|fuel spill/i.test(t))            return 'gas';
  if (/vegetation|grass/i.test(t))               return 'grass';
  if (/electrical|electric/i.test(t))            return 'elec';
  return 'other';
}

function filterData() {
  const from = dateFrom.value;
  const to   = dateTo.value;
  return DATA.filter(d => {
    // Date range
    if (from && d._isoDate < from) return false;
    if (to   && d._isoDate > to)   return false;
    // Name / apparatus
    if (selectedFilter) {
      const [kind, val] = selectedFilter.split(':');
      if (kind === 'person'    && !d._personnel_names.includes(val)) return false;
      if (kind === 'apparatus' && !d._apparatus.includes(val))       return false;
    }
    // Type
    if (typeFilter && d["Incident Type"] !== typeFilter) return false;
    // Search
    if (searchTerm) {
      const hay = (d["Incident Number"]+d["Incident Type"]+d["Location"]+d["Dispatch Time"]).toLowerCase();
      if (!hay.includes(searchTerm)) return false;
    }
    return true;
  }).sort((a,b) => b._date - a._date);
}

function render() {
  const filtered = filterData();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  const totalUnits = filtered.reduce((s,d) => s+d._units, 0);
  const totalPers  = filtered.reduce((s,d) => s+d._pers,  0);
  document.getElementById('statCalls').textContent     = filtered.length;
  document.getElementById('statUnits').textContent     = totalUnits;
  document.getElementById('statPersonnel').textContent = totalPers;

  // Highlight bar
  const bar = document.getElementById('highlightBar');
  const hl  = document.getElementById('highlightText');
  if (selectedFilter && filtered.length > 0) {
    const [kind, val] = selectedFilter.split(':');
    const label = kind === 'apparatus' ? 'apparatus <strong>'+val+'</strong>' : '<strong>'+val+'</strong>';
    const pct = DATA.length ? Math.round((filtered.length / DATA.length) * 100) : 0;
    bar.classList.add('visible');
    hl.innerHTML = `Showing <strong>${filtered.length}</strong> of <strong>${DATA.length}</strong> call${DATA.length!==1?'s':''} (${pct}%) for ${label}`;
  } else {
    bar.classList.remove('visible');
  }

  document.getElementById('resultCount').textContent = `${filtered.length} of ${DATA.length} calls`;
  document.getElementById('emptyState').style.display  = filtered.length === 0 ? 'block' : 'none';
  document.getElementById('callTable').style.display   = filtered.length === 0 ? 'none'  : '';

  const [filterKind, filterVal] = selectedFilter ? selectedFilter.split(':') : ['',''];

  filtered.forEach(d => {
    const isHighlighted = selectedFilter && (
      (filterKind === 'person'    && d._personnel_names.includes(filterVal)) ||
      (filterKind === 'apparatus' && d._apparatus.includes(filterVal))
    );
    const isExp = expandedInc === d["Incident Number"];

    const tr = document.createElement('tr');
    if (isHighlighted) tr.classList.add('my-call');
    if (isExp) tr.classList.add('expanded');

    // Badge: show person name or apparatus name
    let badge = '';
    if (isHighlighted) {
      badge = `<span class="name-badge">${filterVal}</span>`;
    }

    tr.innerHTML = `
      <td><span class="inc-num">${d["Incident Number"]}</span>${badge}</td>
      <td><span class="type-badge ${typeBadgeClass(d["Incident Type"])}">${d["Incident Type"]}</span></td>
      <td class="loc-cell">${d["Location"].replace(/, USA$/, '')}</td>
      <td class="date-cell">${d._dispStr}<br><span style="font-size:.75rem;color:#888">${d._timeStr}</span></td>
      <td class="units-cell">${d._units}</td>
      <td class="pers-cell">${d._pers}</td>
    `;
    tr.addEventListener('click', () => {
      expandedInc = expandedInc === d["Incident Number"] ? null : d["Incident Number"];
      render();
    });
    tbody.appendChild(tr);

    if (isExp) {
      const dtr = document.createElement('tr');
      dtr.className = 'detail-row';
      const chips = d.personnel_list.map(p => {
        const isMatchPerson = filterKind==='person'    && p.name === filterVal;
        const isMatchApp    = filterKind==='apparatus' && p.apparatus.trim() === filterVal;
        const cls = isMatchPerson ? ' me' : isMatchApp ? ' apparatus-match' : '';
        return `<span class="person-chip${cls}">${p.name}</span>`;
      }).join('');

      // Apparatus that responded
      const appList = d._apparatus.length
        ? d._apparatus.map(a => `<span class="person-chip${filterKind==='apparatus'&&filterVal===a?' apparatus-match':''}">${a}</span>`).join('')
        : '<span style="color:var(--mid);font-size:.8rem">None recorded</span>';

      dtr.innerHTML = `<td colspan="6"><div class="detail-inner">
        <div class="detail-section">
          <h4>Location</h4>
          <p style="font-size:.85rem;margin-bottom:10px">${d["Location"].replace(/, USA$/,'')}</p>
          <h4>Dispatch</h4>
          <p style="font-size:.85rem;margin-bottom:10px">${d._dispStr} at ${d._timeStr}</p>
          <h4>Apparatus (${d._apparatus.length})</h4>
          <div class="personnel-grid" style="margin-bottom:0">${appList}</div>
        </div>
        <div class="detail-section">
          <h4>Responding Personnel (${d.personnel_list.length})</h4>
          <div class="personnel-grid">${chips}</div>
        </div>
      </div></td>`;
      tbody.appendChild(dtr);
    }
  });
}

render();

// ── PIN LOCK ──────────────────────────────────────────────────────────────────
// PIN is stored as a salted SHA-256 hash — not readable as a plain number
const _k = 'mpvfd38';
const _h = 'c25a796dca29914ce0fac1fb7f121027ba6f049e0b2cd7aa32fed73d2644685e';

let _pin = '';

async function _digest(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

function pinKey(d) {
  if (_pin.length >= 6) return;
  _pin += d;
  _updateDots();
  if (_pin.length === 6) _checkPin();
}

function pinBack() {
  _pin = _pin.slice(0,-1);
  _updateDots();
  document.getElementById('pinError').textContent = '';
}

function pinClear() {
  _pin = '';
  _updateDots();
  document.getElementById('pinError').textContent = '';
}

function _updateDots(state) {
  for (let i = 0; i < 6; i++) {
    const dot = document.getElementById('dot'+i);
    dot.className = 'pin-dot';
    if (state === 'error') dot.classList.add('error');
    else if (i < _pin.length) dot.classList.add('filled');
  }
}

async function _checkPin() {
  const attempt = await _digest(_k + _pin);
  if (attempt === _h) {
    document.getElementById('pinScreen').classList.add('hidden');
    // Store session so refresh doesn't re-prompt
    sessionStorage.setItem('_auth', '1');
  } else {
    _updateDots('error');
    document.getElementById('pinError').textContent = 'Incorrect PIN — try again';
    setTimeout(() => { _pin = ''; _updateDots(); }, 1000);
  }
}

// Skip PIN if already authenticated this session
if (sessionStorage.getItem('_auth') === '1') {
  document.getElementById('pinScreen').classList.add('hidden');
}

// Also support keyboard entry
document.addEventListener('keydown', e => {
  if (document.getElementById('pinScreen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  else if (e.key === 'Backspace') pinBack();
  else if (e.key === 'Escape') pinClear();
});

</script>
